name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SortedApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publishes the APK to a Release so you can download it straight on your phone.
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SortedApp.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SortedApp.apk \
            --title "Latest build" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. Download SortedApp.apk and install it on your phone."
