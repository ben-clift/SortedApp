name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK; just make sure licences are accepted
      # so Gradle can download any missing platform pieces.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Optional: if the KEYSTORE_B64 and KEYSTORE_PASSWORD repo secrets exist, every build is
      # signed with the same key, which lets Android install a new version over the old one.
      - name: Load signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sorted.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/sorted.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the stored key"
          else
            echo "No signing key configured; using the default debug key"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SortedApp-${{ env.VERSION }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # One release per build (v1.0.N). Each release carries two copies of the APK:
      #   SortedApp-1.0.N.apk  - has the version in the file name, so downloads are easy to tell apart
      #   SortedApp.apk        - fixed name, so the "latest" download link always works
      - name: Publish release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "SortedApp-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk SortedApp.apk
          gh release create "v$VERSION" "SortedApp-$VERSION.apk" SortedApp.apk \
            --title "SortedApp v$VERSION" \
            --notes "Version $VERSION (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}). Download SortedApp-$VERSION.apk and install it on your phone." \
            --latest
